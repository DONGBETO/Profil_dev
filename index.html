<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon portfolio</title>
</head>
<body>
    <header>
        <h1>Christian Emmanuel DONGBETO</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="#projets">Projets</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="apropos">
            <h2>À propos de moi</h2>
            <img src="https://placehold.co/200" alt="Ma photo de profil">
            <p>Je suis DONGBETO Christian Emmanuel, développeur web</p>
        </section>
        <section class="projets" id="projets">
            <h2>Mes projets</h2>
            <p>Bientôt disponible</p>
        </section>
        <section class="competences">
            <h2>Mes Compétences</h2>
            <ul>
                <li>HTML et CSS</li>
                <li>JavaScript</li>
                <li>React.js</li>
            </ul>
        </section>
        <section id="contact">
            <h2>Formulaire de contact</h2>
            <form action="">
                <label for="nom">Nom</label>
                <input type="text" id="nom" required name="nom">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Mon message</label>
                <textarea name="message" id="message" rows="5" required></textarea>
                <button type="submit">Envoyer</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 DONGBETO Christian Emmanuel</p>
    </footer>
</body>
</html>
